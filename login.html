<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI LifeLens - Login</title>

<link rel="stylesheet" href="css/style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

</head><body><div class="container">

    <div class="logo">🔐</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">Login to AI LifeLens</p>

    <input
        type="email"
        id="email"
        placeholder="Enter Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
    >

    <button onclick="login()">
        Login 🚀
    </button>

    <p id="message"></p>

</div>

<!-- Firebase Configuration -->
<script src="js/firebase.js"></script>

<script>

    function login() {

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        if (email === "" || password === "") {
            message.innerHTML = "⚠️ Please enter email and password.";
            return;
        }

        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {

                message.innerHTML = "✅ Login successful!";

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);

            })
            .catch((error) => {

                console.error(error);

                if (error.code === "auth/invalid-credential") {
                    message.innerHTML = "❌ Invalid email or password.";
                }
                else if (error.code === "auth/user-not-found") {
                    message.innerHTML = "❌ Account not found. Please register first.";
                }
                else if (error.code === "auth/wrong-password") {
                    message.innerHTML = "❌ Wrong password.";
                }
                else if (error.code === "auth/invalid-email") {
                    message.innerHTML = "❌ Invalid email address.";
                }
                else {
                    message.innerHTML = "❌ " + error.message;
                }

            });
    }

</script>

</body>
</html>
